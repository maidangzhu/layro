name: Feature request
description: Suggest a user-facing capability or workflow improvement
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is broken or too expensive today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should layro do?
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Example usage
      description: Show the ideal command or output shape
